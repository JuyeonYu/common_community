# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { ENV["USER"] } %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>

development:
  primary:
    <<: *default
    database: jiindo_development
  cache:
    <<: *default
    database: jiindo_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: jiindo_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: jiindo_development_cable
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: jiindo_test

production:
  primary:
    <<: *default
    database: jiindo_production
    username: jiindo
    password: <%= ENV["JIINDO_DATABASE_PASSWORD"] %>
  cache:
    <<: *default
    database: jiindo_production_cache
    username: jiindo
    password: <%= ENV["JIINDO_DATABASE_PASSWORD"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: jiindo_production_queue
    username: jiindo
    password: <%= ENV["JIINDO_DATABASE_PASSWORD"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: jiindo_production_cable
    username: jiindo
    password: <%= ENV["JIINDO_DATABASE_PASSWORD"] %>
    migrations_paths: db/cable_migrate
