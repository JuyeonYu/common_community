# PostgreSQL. Versions 9.3 and up are supported.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { ENV["USER"] } %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>

development:
  primary:
    <<: *default
    database: blackticket_development
  cache:
    <<: *default
    database: blackticket_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: blackticket_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: blackticket_development_cable
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: blackticket_test

production:
  primary:
    <<: *default
    database: blackticket_production
    username: blackticket
    password: <%= ENV["BLACKTICKET_DATABASE_PASSWORD"] %>
  cache:
    <<: *default
    database: blackticket_production_cache
    username: blackticket
    password: <%= ENV["BLACKTICKET_DATABASE_PASSWORD"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: blackticket_production_queue
    username: blackticket
    password: <%= ENV["BLACKTICKET_DATABASE_PASSWORD"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: blackticket_production_cable
    username: blackticket
    password: <%= ENV["BLACKTICKET_DATABASE_PASSWORD"] %>
    migrations_paths: db/cable_migrate
