# 서비스 이름 — 컨테이너/네트워크 이름의 prefix가 됨.
service: blackticket

# 푸시할 이미지 이름. Docker Hub: <username>/<repo>.
image: juyeon88/blackticket

# 배포 대상 서버. 단일 호스트에 Puma 내장 Solid Queue로 워커까지 같이 돌림.
servers:
  web:
    - 158.247.217.34

# Kamal proxy(Let's Encrypt 자동 갱신). SSL 종단은 proxy가 담당.
# 주의: 이 옵션을 켰으면 production.rb에서 assume_ssl/force_ssl도 켜야 함.
proxy:
  ssl: true
  host: blackticket.messageopen.com

# 컨테이너 레지스트리(Docker Hub).
registry:
  server: docker.io
  username: juyeon88
  password:
    - KAMAL_REGISTRY_PASSWORD

# 컨테이너에 주입할 환경변수. secrets는 .kamal/secrets에서 로드.
env:
  secret:
    - RAILS_MASTER_KEY
    - BLACKTICKET_DATABASE_PASSWORD
  clear:
    # Solid Queue 워커를 Puma 프로세스 안에서 같이 실행.
    SOLID_QUEUE_IN_PUMA: true

    # DB 접속 정보. host는 accessory 이름(blackticket-db) — 같은 도커 네트워크에서 DNS로 해소됨.
    DATABASE_HOST: blackticket-db

# 자주 쓰는 명령 단축어. "bin/kamal console" 등으로 호출.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Active Storage(:local) 업로드 파일을 컨테이너 재배포 시에도 보존하기 위한 볼륨.
volumes:
  - "blackticket_storage:/rails/storage"

# 무중단 배포 시 신·구 컨테이너가 같은 자산을 잠시 공유할 수 있도록 핑거프린트된 자산을 브릿지.
asset_path: /rails/public/assets

# 이미지 빌더. 로컬 Mac은 arm64지만 운영 서버는 amd64이므로 amd64로 빌드.
builder:
  arch: amd64

# 부속 서비스. PostgreSQL을 같은 호스트에 컨테이너로 띄움(외부 노출 차단).
accessories:
  db:
    image: postgres:16-alpine
    host: 158.247.217.34
    # 호스트 localhost에서만 접근 가능하도록 바인딩. 외부 인터넷에는 노출되지 않음.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: blackticket
        POSTGRES_DB: blackticket_production
      secret:
        - POSTGRES_PASSWORD
    files:
      # 최초 부팅 시 Solid Cache/Queue/Cable용 DB도 함께 생성.
      - config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    directories:
      # 컨테이너 재배포 후에도 데이터 유지.
      - data:/var/lib/postgresql/data
